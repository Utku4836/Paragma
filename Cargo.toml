[package]
name = "paragma"
version = "0.3.1"
edition = "2024"
description = "Agent-first memory: project notes as Markdown files, found by hybrid search"
license = "MIT"
repository = "https://github.com/Utku4836/Paragma"
default-run = "pg"

[[bin]]
name = "pg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fst = "0.4"
half = "2"
regex = "1.13.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-containerfile = "0.9.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.3.0"
tree-sitter-gdscript = "6.1.0"
tree-sitter-glsl = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-graphql = "0.3.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-luau = "1.2.0"
tree-sitter-php = "0.25.1"
tree-sitter-proto = "0.6.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"
tree-sitter-wgsl-bevy = "0.1.4"
tree-sitter-zig = "1.1.2"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4

[workspace]
members = [".", "tools/build-model"]
