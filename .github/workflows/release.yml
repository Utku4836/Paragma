name: Release

# Push a tag like v0.1.0: builds pg for every platform, attaches the binaries
# to a GitHub release and, when the NPM_TOKEN secret is set, publishes the
# npm package "paragma" with the same version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/Utku4836/Paragma/internal/cli.Version=$v" \
              -o "dist/pg-$os-$arch$ext" ./cmd/pg
          done
          (cd dist && sha256sum pg-* > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # re-running the workflow (for example after adding NPM_TOKEN) updates the assets
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Paragma $GITHUB_REF_NAME" --generate-notes
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set: npm publish skipped"; exit 0; fi
          v="${GITHUB_REF_NAME#v}"
          publish() { # dir: publish unless this version is already on npm (re-runs are safe)
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$v" version >/dev/null 2>&1; then echo "$name@$v already on npm"; return; fi
            (cd "$1" && npm publish --access public)
          }
          # one package per platform holding the binary; npm installs only
          # the one whose os/cpu match, so no install script is needed
          for f in dist/pg-*; do
            t="${f#dist/pg-}"; t="${t%.exe}"; os="${t%-*}"; arch="${t#*-}"
            nos="${os/windows/win32}"; narch="${arch/amd64/x64}"
            d="npm-$nos-$narch"; bin="pg"; [ "$os" = windows ] && bin="pg.exe"
            mkdir -p "$d/bin" && cp "$f" "$d/bin/$bin" && chmod 755 "$d/bin/$bin"
            cat > "$d/package.json" <<EOF
          {"name": "paragma-$nos-$narch", "version": "$v", "description": "The pg binary of paragma for $nos/$narch.",
           "repository": {"type": "git", "url": "git+https://github.com/Utku4836/Paragma.git"}, "license": "MIT",
           "os": ["$nos"], "cpu": ["$narch"], "files": ["bin"]}
          EOF
            publish "$d"
          done
          cd npm
          npm version "$v" --no-git-tag-version --allow-same-version
          for t in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do npm pkg set "optionalDependencies.paragma-$t=$v"; done
          # npm does not resolve the README's relative image paths
          sed 's#src="\.github/#src="https://raw.githubusercontent.com/Utku4836/Paragma/main/.github/#' ../README.md > README.md
          cd .. && publish npm
