name: Release

# Push a tag like v0.1.0: builds pg for every platform, attaches the binaries
# to a GitHub release and publishes the npm package "paragma" with the same
# version. npm accepts this workflow as a trusted publisher (OIDC), so no
# token is needed; an NPM_TOKEN secret, if set, is used as a fallback.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/Utku4836/Paragma/internal/cli.Version=$v" \
              -o "dist/pg-$os-$arch$ext" ./cmd/pg
          done
          (cd dist && sha256sum pg-* > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # re-running the workflow (for example after adding NPM_TOKEN) updates the assets
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Paragma $GITHUB_REF_NAME" --generate-notes
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
          v="${GITHUB_REF_NAME#v}"
          if npm view "paragma@$v" version >/dev/null 2>&1; then echo "paragma@$v already on npm"; exit 0; fi
          # one package with every platform's binary; bin/pg runs the one for this machine
          for f in dist/pg-*; do
            t="${f#dist/pg-}"; ext=""; [ "${t%.exe}" != "$t" ] && ext=".exe"; t="${t%.exe}"
            os="${t%-*}"; arch="${t#*-}"
            cp "$f" "npm/bin/pg-${os/windows/win32}-${arch/amd64/x64}$ext"
          done
          chmod 755 npm/bin/*
          cd npm
          npm version "$v" --no-git-tag-version --allow-same-version
          # npm does not resolve the README's relative image paths
          sed 's#src="\.github/#src="https://raw.githubusercontent.com/Utku4836/Paragma/main/.github/#' ../README.md > README.md
          npm publish --access public
