name: Release

# Push a tag like v0.2.0: builds pg for every platform, attaches the
# binaries to a GitHub release and publishes the npm package "paragma" with
# the same version. The package is small: when it is installed it downloads
# the one binary for that computer from the release (npm/install.js) and
# checks it against the SHA256SUMS packed into it. npm accepts this workflow
# as a trusted publisher (OIDC), so no token is needed. A tag with a suffix
# (v0.2.0-rc.1) is a pre-release, published under npm's "next" tag.
#
# Run by hand (Actions > Release > Run workflow) it only builds, to try the
# builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm trusted publishing

jobs:
  # the embedded model, built once from its source and shared by every build
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the version comes from Cargo.toml, set before tagging (Cargo.lock follows it)
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $have"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: target/model-src
          key: model-src-potion-multilingual-128M
      - run: bash tools/build-model/fetch.sh
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model/

  build:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, ext: .exe }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { name: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: model/
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Linux: a static binary (musl), so it runs on any distribution
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq musl-tools
          t="${{ matrix.target }}"
          echo "CC_${t//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin pg
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pg${{ matrix.ext }}" "dist/pg-${{ matrix.name }}${{ matrix.ext }}"
      # the binary runs on the machine that built it (all but the Intel Mac one)
      - if: matrix.name != 'darwin-x64'
        shell: bash
        run: |
          pg="$PWD/dist/pg-${{ matrix.name }}${{ matrix.ext }}"
          "$pg" --version
          export PARAGMA_HOME="$RUNNER_TEMP/pghome"
          mkdir -p "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          "$pg" open smoke --goal "Smoke test"
          "$pg" write --rule "Smoke tests run in CI on every platform."
          "$pg" find "smoke test platform" | grep -q "Smoke tests"
      - uses: actions/upload-artifact@v4
        with:
          name: pg-${{ matrix.name }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pg-*
          path: dist/
          merge-multiple: true
      - name: Checksums and compressed copies
        run: |
          cd dist
          sha256sum pg-* > SHA256SUMS
          # the installer downloads the compressed copy (half the size) and checks the binary
          for f in pg-*; do gzip -9 -k "$f"; done
          ls -la
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=""; [ -f "docs/releases/$GITHUB_REF_NAME.md" ] && notes="--notes-file docs/releases/$GITHUB_REF_NAME.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac # v0.2.0-rc.1
            gh release create "$GITHUB_REF_NAME" dist/* --title "Paragma $GITHUB_REF_NAME" ${notes:---generate-notes} $pre
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm
        run: |
          npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
          v="${GITHUB_REF_NAME#v}"
          if npm view "paragma@$v" version >/dev/null 2>&1; then echo "paragma@$v already on npm"; exit 0; fi
          cp dist/SHA256SUMS npm/SHA256SUMS
          cd npm
          npm version "$v" --no-git-tag-version --allow-same-version
          # npm does not resolve the README's relative image paths
          sed 's#src="\.github/#src="https://raw.githubusercontent.com/Utku4836/Paragma/main/.github/#' ../README.md > README.md
          # a pre-release goes to the "next" tag, so npm install paragma keeps the last release
          tag=latest; case "$v" in *-*) tag=next;; esac
          npm publish --access public --tag "$tag"
